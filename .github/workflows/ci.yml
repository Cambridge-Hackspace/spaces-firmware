name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The protocol core has no hardware in it, so it is built and tested on the
  # runner itself. This is the job that guards the rules a module must never
  # get wrong.
  core:
    name: Protocol core (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml, so the pinned nightly is installed
      # on first use.
      - name: Format
        run: cargo fmt --all -- --check
      # The tests only build for the host, so this is the only lint that
      # sees them.
      - name: Clippy
        run: cargo clippy -p spaces-device --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - name: Test
        run: cargo test -p spaces-device --target x86_64-unknown-linux-gnu

  firmware:
    name: Firmware (esp32c6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ldproxy
        run: cargo install ldproxy --locked
      # The first build downloads ESP-IDF and its toolchain into .embuild;
      # caching it saves most of a build's time.
      - uses: actions/cache@v6
        with:
          path: .embuild
          key: embuild-${{ runner.os }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig.defaults') }}
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --release -- -D warnings
      - name: Build
        run: cargo build --release
      # What a change costs on the chip: the image's sections here and on the
      # base branch, side by side in the job summary. Pull requests only; the
      # base is built in its own target dir, sharing the ESP-IDF download.
      - name: Image size against the base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          sections() { size -A --target=elf32-little "$1" | awk 'NR>2 && $1 ~ /^\./ {print $1, $2}'; }
          sections target/riscv32imac-esp-espidf/release/buttons >head.txt
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../base FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/.embuild" ../base/.embuild
          (cd ../base && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-base" cargo build --release)
          sections target-base/riscv32imac-esp-espidf/release/buttons >base.txt
          {
            echo "### Image size, base -> this change (bytes)"
            echo
            echo "| section | base | this | change |"
            echo "|---|---:|---:|---:|"
            awk 'NR==FNR {b[$1]=$2; next} {d=$2-b[$1]; if (b[$1] != "" || $2 > 0) printf "| %s | %d | %d | %+d |\n", $1, b[$1], $2, d; seen[$1]=1}
                 END {for (k in b) if (!seen[k]) printf "| %s | %d | 0 | %+d |\n", k, b[k], -b[k]}' base.txt head.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"
